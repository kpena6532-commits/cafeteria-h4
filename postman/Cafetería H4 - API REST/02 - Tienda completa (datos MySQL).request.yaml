$kind: http-request
url: "{{baseUrl}}/api/tienda"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('200 OK', () => pm.response.to.have.status(200));
      const data=pm.response.json();
      pm.test('Título y productos vienen de MySQL', () => {pm.expect(data.configuracion.titulo_inicio).to.be.a('string');pm.expect(data.productos).to.be.an('array');});
    language: text/javascript
order: 2000
