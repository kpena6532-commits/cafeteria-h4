$kind: http-request
url: "{{baseUrl}}/api/contenido/productos"
method: GET
scripts:
  - type: afterResponse
    code: pm.test('Precios desde la base', () => {pm.response.to.have.status(200);pm.response.json().forEach(p=>pm.expect(Number(p.precio)).to.be.at.least(0));});
    language: text/javascript
order: 4000
